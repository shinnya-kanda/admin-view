<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配車管理｜GitHub完結 CSV/localStorage版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background:#f6f7f9; }
    .app-header { background:#fff; border-bottom:1px solid #e5e7eb; position:sticky; top:0; z-index:10; }
    .card { border:0; box-shadow:0 8px 24px rgba(0,0,0,.06); }
    .mono { font-variant-numeric: tabular-nums; }
    .required::after { content:" *"; color:#dc3545; }
    .pill { display:inline-block; border:1px solid #ddd; border-radius:999px; padding:2px 8px; background:#fff; font-size:.82rem; }
    textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="container py-3">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2">
        <div>
          <h1 class="h4 fw-bold mb-1">配車管理｜データ入力・CRUD</h1>
          <div class="text-secondary small">GitHub Pagesだけで動作 / 保存はlocalStorage / CSVでバックアップ・復元可能</div>
        </div>
        <div class="d-flex flex-wrap align-items-end gap-2">
          <div>
            <label class="form-label small mb-1">表示日</label>
            <input id="filterDate" type="date" class="form-control" />
          </div>
          <button id="sampleBtn" class="btn btn-outline-primary">サンプル追加</button>
          <button id="exportBtn" class="btn btn-outline-success">CSV出力</button>
          <label class="btn btn-outline-secondary mb-0">
            CSV取込 <input id="importFile" type="file" accept=".csv,text/csv" hidden />
          </label>
          <button id="clearBtn" class="btn btn-outline-danger">全削除</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <div id="messageArea"></div>

    <section class="card mb-4" id="entrySection">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
          <div>
            <h2 class="h5 fw-bold mb-1" id="formTitle">データ入力（STOP作成）</h2>
            <div class="text-secondary small">ここに入力して保存すると、下の一覧・集計へすぐ反映されます。</div>
          </div>
          <span class="badge text-bg-primary">入力欄</span>
        </div>

        <input id="editId" type="hidden" />
        <div class="row g-3">
          <div class="col-12 col-md-3">
            <label class="form-label required">引取日</label>
            <input id="pickupDate" type="date" class="form-control" />
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label required">納入日</label>
            <input id="deliveryDate" type="date" class="form-control" />
          </div>
          <div class="col-12 col-md-2">
            <label class="form-label required">集荷時刻</label>
            <input id="pickupTime" type="time" class="form-control" value="09:00" />
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label required">担当ドライバー</label>
            <input id="driverName" class="form-control" placeholder="例：津田ドライバー" list="driverList" />
            <datalist id="driverList">
              <option value="津田ドライバー"></option>
              <option value="作見ドライバー"></option>
              <option value="山本ドライバー"></option>
              <option value="中村ドライバー"></option>
              <option value="管理者"></option>
            </datalist>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label required">集荷先</label>
            <input id="pickupName" class="form-control" placeholder="例：興和工業所 2" list="pickupList" />
            <datalist id="pickupList">
              <option value="興和工業所 2"></option>
              <option value="後藤鉄工 1"></option>
              <option value="曽田製作所 3"></option>
              <option value="〇〇株式会社 4"></option>
            </datalist>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label required">送付先</label>
            <input id="destinationName" class="form-control" placeholder="例：小布施DC" list="destinationList" />
            <datalist id="destinationList">
              <option value="小布施DC"></option>
              <option value="関東DDC"></option>
              <option value="安城営業所"></option>
              <option value="粟津工場"></option>
              <option value="千葉センター"></option>
            </datalist>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label required">送付先営業所</label>
            <input id="branchName" class="form-control" placeholder="例：小布施営業所" list="branchList" />
            <datalist id="branchList">
              <option value="小布施営業所"></option>
              <option value="関東営業所"></option>
              <option value="安城営業所"></option>
              <option value="こまつ営業所"></option>
            </datalist>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label required">数量</label>
            <input id="qty" type="number" min="0" class="form-control" value="1" />
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label required">重量kg</label>
            <input id="weightKg" type="number" min="0" class="form-control" value="50" />
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label">状態</label>
            <select id="status" class="form-select">
              <option value="todo">未完了</option>
              <option value="done">完了</option>
              <option value="hold">保留</option>
            </select>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label">備考</label>
            <input id="note" class="form-control" placeholder="例：至急 / 梱包注意 / 2便目" />
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-3">
          <button id="saveBtn" class="btn btn-primary px-4">保存</button>
          <button id="cancelBtn" class="btn btn-outline-secondary" style="display:none;">編集キャンセル</button>
          <button id="resetBtn" class="btn btn-outline-secondary">入力リセット</button>
        </div>
      </div>
    </section>

    <section class="row g-3 mb-4">
      <div class="col-12 col-lg-8">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
              <div>
                <h2 class="h5 fw-bold mb-1">STOP一覧・CRUD</h2>
                <div class="text-secondary small">保存したデータを編集・複製・削除できます。</div>
              </div>
              <input id="searchInput" class="form-control" style="max-width:320px;" placeholder="検索：集荷先/送付先/営業所/ドライバー" />
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>日付/時刻</th>
                    <th>集荷先 → 送付先</th>
                    <th>担当</th>
                    <th class="text-end">数量</th>
                    <th class="text-end">重量</th>
                    <th>状態</th>
                    <th class="text-end">操作</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5 fw-bold mb-3">当日サマリー</h2>
            <div id="summaryArea" class="vstack gap-2"></div>
            <hr />
            <h3 class="h6 fw-bold">営業所別集計</h3>
            <div id="branchSummary" class="vstack gap-2 small"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5 fw-bold mb-2">CSVデータ</h2>
        <div class="text-secondary small mb-2">GitHub上でDBを使わない代替として、現在のデータをCSVで確認・コピーできます。</div>
        <textarea id="csvPreview" class="form-control" rows="8" readonly></textarea>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'dispatch_stops_csv_local_v2';
    const $ = (id) => document.getElementById(id);

    const columns = ['id','pickupDate','deliveryDate','pickupTime','driverName','pickupName','destinationName','branchName','qty','weightKg','status','note','createdAt','updatedAt'];

    function today(){
      const d = new Date();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      return `${d.getFullYear()}-${mm}-${dd}`;
    }

    function uid(){
      return 'stop_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
    }

    function escapeHtml(v){
      return String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }

    function getData(){
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }

    function setData(rows){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
    }

    function showMessage(text, type='success'){
      $('messageArea').innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">${escapeHtml(text)}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
    }

    function statusLabel(status){
      if(status === 'done') return '完了';
      if(status === 'hold') return '保留';
      return '未完了';
    }

    function statusClass(status){
      if(status === 'done') return 'text-bg-secondary';
      if(status === 'hold') return 'text-bg-danger';
      return 'text-bg-warning';
    }

    function csvEscape(value){
      const s = String(value ?? '');
      if(/[",\n\r]/.test(s)) return '"' + s.replaceAll('"','""') + '"';
      return s;
    }

    function toCsv(rows){
      const lines = [columns.join(',')];
      rows.forEach(row => lines.push(columns.map(c => csvEscape(row[c])).join(',')));
      return lines.join('\n');
    }

    function parseCsvLine(line){
      const values = [];
      let current = '';
      let quoted = false;
      for(let i=0; i<line.length; i++){
        const ch = line[i];
        if(quoted){
          if(ch === '"' && line[i+1] === '"') { current += '"'; i++; }
          else if(ch === '"') quoted = false;
          else current += ch;
        } else {
          if(ch === '"') quoted = true;
          else if(ch === ',') { values.push(current); current = ''; }
          else current += ch;
        }
      }
      values.push(current);
      return values;
    }

    function fromCsv(csvText){
      const lines = csvText.replace(/^\uFEFF/, '').split(/\r?\n/).filter(line => line.trim() !== '');
      if(lines.length <= 1) return [];
      const headers = parseCsvLine(lines[0]);
      return lines.slice(1).map(line => {
        const values = parseCsvLine(line);
        const row = {};
        headers.forEach((h, i) => row[h] = values[i] ?? '');
        row.qty = Number(row.qty || 0);
        row.weightKg = Number(row.weightKg || 0);
        if(!row.id) row.id = uid();
        if(!row.createdAt) row.createdAt = new Date().toISOString();
        row.updatedAt = new Date().toISOString();
        return row;
      });
    }

    function readForm(){
      const row = {
        id: $('editId').value || uid(),
        pickupDate: $('pickupDate').value,
        deliveryDate: $('deliveryDate').value,
        pickupTime: $('pickupTime').value,
        driverName: $('driverName').value.trim(),
        pickupName: $('pickupName').value.trim(),
        destinationName: $('destinationName').value.trim(),
        branchName: $('branchName').value.trim(),
        qty: Number($('qty').value),
        weightKg: Number($('weightKg').value),
        status: $('status').value,
        note: $('note').value.trim(),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      if(!row.pickupDate || !row.deliveryDate || !row.pickupTime || !row.driverName || !row.pickupName || !row.destinationName || !row.branchName){
        throw new Error('必須項目を入力してください。');
      }
      if(!Number.isFinite(row.qty) || row.qty < 0 || !Number.isFinite(row.weightKg) || row.weightKg < 0){
        throw new Error('数量・重量は0以上の数字で入力してください。');
      }
      return row;
    }

    function resetForm(){
      $('editId').value = '';
      $('formTitle').textContent = 'データ入力（STOP作成）';
      $('saveBtn').textContent = '保存';
      $('cancelBtn').style.display = 'none';
      $('pickupDate').value = $('filterDate').value || today();
      $('deliveryDate').value = $('filterDate').value || today();
      $('pickupTime').value = '09:00';
      $('driverName').value = '';
      $('pickupName').value = '';
      $('destinationName').value = '';
      $('branchName').value = '';
      $('qty').value = 1;
      $('weightKg').value = 50;
      $('status').value = 'todo';
      $('note').value = '';
    }

    function saveForm(){
      try {
        const row = readForm();
        const rows = getData();
        const idx = rows.findIndex(r => r.id === row.id);
        if(idx >= 0){
          row.createdAt = rows[idx].createdAt || row.createdAt;
          rows[idx] = row;
          showMessage('データを更新しました。');
        } else {
          rows.push(row);
          showMessage('データを追加しました。一覧と集計に反映しました。');
        }
        setData(rows);
        $('filterDate').value = row.pickupDate;
        resetForm();
        render();
      } catch(err){
        showMessage(err.message, 'danger');
      }
    }

    function editRow(id){
      const row = getData().find(r => r.id === id);
      if(!row) return;
      $('editId').value = row.id;
      $('pickupDate').value = row.pickupDate;
      $('deliveryDate').value = row.deliveryDate;
      $('pickupTime').value = row.pickupTime;
      $('driverName').value = row.driverName;
      $('pickupName').value = row.pickupName;
      $('destinationName').value = row.destinationName;
      $('branchName').value = row.branchName;
      $('qty').value = row.qty;
      $('weightKg').value = row.weightKg;
      $('status').value = row.status;
      $('note').value = row.note || '';
      $('formTitle').textContent = 'データ編集';
      $('saveBtn').textContent = '更新';
      $('cancelBtn').style.display = '';
      document.getElementById('entrySection').scrollIntoView({behavior:'smooth', block:'start'});
    }

    function duplicateRow(id){
      const row = getData().find(r => r.id === id);
      if(!row) return;
      const copy = {...row, id: uid(), note: (row.note ? row.note + ' / ' : '') + '複製', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()};
      setData([...getData(), copy]);
      showMessage('データを複製しました。');
      render();
    }

    function deleteRow(id){
      if(!confirm('このデータを削除します。よろしいですか？')) return;
      setData(getData().filter(r => r.id !== id));
      showMessage('データを削除しました。');
      render();
    }

    function setStatus(id, status){
      const rows = getData();
      const row = rows.find(r => r.id === id);
      if(!row) return;
      row.status = status;
      row.updatedAt = new Date().toISOString();
      setData(rows);
      render();
    }

    function filteredRows(){
      const date = $('filterDate').value;
      const q = $('searchInput').value.trim().toLowerCase();
      return getData().filter(r => {
        const dateOk = !date || r.pickupDate === date;
        const text = [r.driverName,r.pickupName,r.destinationName,r.branchName,r.note].join(' ').toLowerCase();
        return dateOk && (!q || text.includes(q));
      }).sort((a,b) => `${a.pickupDate} ${a.pickupTime}`.localeCompare(`${b.pickupDate} ${b.pickupTime}`));
    }

    function renderTable(rows){
      const tbody = $('tableBody');
      tbody.innerHTML = '';
      if(rows.length === 0){
        tbody.innerHTML = '<tr><td colspan="7" class="text-secondary text-center py-4">データがありません。上の「データ入力」から保存してください。</td></tr>';
        return;
      }
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="mono"><div>${escapeHtml(r.pickupDate)}</div><div class="text-secondary small">${escapeHtml(r.pickupTime)}</div></td>
          <td><div class="fw-semibold">${escapeHtml(r.pickupName)} → ${escapeHtml(r.destinationName)}</div><div class="text-secondary small">${escapeHtml(r.branchName)} ${r.note ? ' / ' + escapeHtml(r.note) : ''}</div></td>
          <td>${escapeHtml(r.driverName)}</td>
          <td class="text-end mono">${escapeHtml(r.qty)}</td>
          <td class="text-end mono">${escapeHtml(r.weightKg)}kg</td>
          <td><span class="badge ${statusClass(r.status)}">${statusLabel(r.status)}</span></td>
          <td class="text-end">
            <div class="btn-group btn-group-sm mb-1">
              <button class="btn btn-outline-primary" onclick="editRow('${r.id}')">編集</button>
              <button class="btn btn-outline-secondary" onclick="duplicateRow('${r.id}')">複製</button>
              <button class="btn btn-outline-danger" onclick="deleteRow('${r.id}')">削除</button>
            </div>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-warning" onclick="setStatus('${r.id}','todo')">未</button>
              <button class="btn btn-outline-success" onclick="setStatus('${r.id}','done')">完</button>
              <button class="btn btn-outline-danger" onclick="setStatus('${r.id}','hold')">保</button>
            </div>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    function renderSummary(rows){
      const totalQty = rows.reduce((a,r) => a + Number(r.qty || 0), 0);
      const totalWeight = rows.reduce((a,r) => a + Number(r.weightKg || 0), 0);
      const done = rows.filter(r => r.status === 'done').length;
      const todo = rows.filter(r => r.status === 'todo').length;
      const hold = rows.filter(r => r.status === 'hold').length;
      $('summaryArea').innerHTML = `
        <div><span class="pill">STOP ${rows.length}件</span></div>
        <div><span class="pill">数量 ${totalQty}</span> <span class="pill">重量 ${totalWeight}kg</span></div>
        <div><span class="pill">未完了 ${todo}</span> <span class="pill">完了 ${done}</span> <span class="pill">保留 ${hold}</span></div>`;

      const map = new Map();
      rows.forEach(r => {
        if(!map.has(r.branchName)) map.set(r.branchName, {count:0, qty:0, weight:0});
        const v = map.get(r.branchName);
        v.count += 1;
        v.qty += Number(r.qty || 0);
        v.weight += Number(r.weightKg || 0);
      });
      $('branchSummary').innerHTML = '';
      if(map.size === 0){
        $('branchSummary').innerHTML = '<div class="text-secondary">集計データなし</div>';
        return;
      }
      [...map.entries()].sort((a,b) => b[1].weight - a[1].weight).forEach(([branch, v]) => {
        const div = document.createElement('div');
        div.className = 'border rounded p-2 bg-white';
        div.innerHTML = `<div class="fw-semibold">${escapeHtml(branch)}</div><div class="text-secondary">${v.count}件 / 数量 ${v.qty} / 重量 ${v.weight}kg</div>`;
        $('branchSummary').appendChild(div);
      });
    }

    function renderCsv(){
      $('csvPreview').value = toCsv(getData());
    }

    function render(){
      const rows = filteredRows();
      renderTable(rows);
      renderSummary(rows);
      renderCsv();
    }

    function addSample(){
      const d = $('filterDate').value || today();
      const samples = [
        ['津田ドライバー','興和工業所 2','小布施DC','小布施営業所',8,560,'todo','サンプル'],
        ['作見ドライバー','後藤鉄工 1','関東DDC','関東営業所',4,320,'todo',''],
        ['山本ドライバー','曽田製作所 3','粟津工場','こまつ営業所',10,750,'done',''],
        ['中村ドライバー','〇〇株式会社 4','千葉センター','関東営業所',2,180,'hold','確認中']
      ];
      const rows = getData();
      samples.forEach((s, i) => rows.push({
        id: uid(), pickupDate: d, deliveryDate: d, pickupTime: `${String(9+i).padStart(2,'0')}:00`,
        driverName: s[0], pickupName: s[1], destinationName: s[2], branchName: s[3], qty: s[4], weightKg: s[5], status: s[6], note: s[7],
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      }));
      setData(rows);
      showMessage('サンプルデータを追加しました。');
      render();
    }

    function exportCsv(){
      const blob = new Blob([toCsv(getData())], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dispatch_stops_${today()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    $('saveBtn').addEventListener('click', saveForm);
    $('resetBtn').addEventListener('click', resetForm);
    $('cancelBtn').addEventListener('click', resetForm);
    $('sampleBtn').addEventListener('click', addSample);
    $('exportBtn').addEventListener('click', exportCsv);
    $('filterDate').addEventListener('change', () => { resetForm(); render(); });
    $('searchInput').addEventListener('input', render);
    $('clearBtn').addEventListener('click', () => {
      if(confirm('全データを削除します。よろしいですか？')){
        setData([]);
        showMessage('全データを削除しました。');
        render();
      }
    });
    $('importFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const text = await file.text();
      const imported = fromCsv(text);
      if(imported.length === 0){ showMessage('CSVからデータを読み取れませんでした。', 'danger'); return; }
      const modeAppend = confirm('OK: 既存データに追加します。\nキャンセル: 既存データを置き換えます。');
      setData(modeAppend ? [...getData(), ...imported] : imported);
      showMessage(`CSVを取り込みました：${imported.length}件`);
      e.target.value = '';
      render();
    });

    window.editRow = editRow;
    window.duplicateRow = duplicateRow;
    window.deleteRow = deleteRow;
    window.setStatus = setStatus;

    $('filterDate').value = today();
    resetForm();
    render();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
